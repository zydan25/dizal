{% extends "base.html" %}
{% block content %}
<div class="page-heading"><h1>إضافة أصل</h1><p>يخصم سعر الأصل من الصندوق المحدد ويسجل له سند.</p></div>
<form method="post" class="mobile-form card-form">
<input type="hidden" name="csrf_token" value="{{csrf_token()}}">
<label>اسم الأصل<input name="name" required></label>
<div class="two-col"><label>الفئة<input name="category" placeholder="خزان / مضخة / تجهيز"></label><label>القيمة<input name="cost" type="number" step="0.001" min="0.001" required></label></div>
<label>التاريخ<input name="acquisition_date" type="date" value="{{today}}" required></label>
<label>الصندوق الدافع<select name="payer_cashbox_id" required>{% for box in cashboxes %}<option value="{{box.id}}">{{box.name}}</option>{% endfor %}</select></label>
<label>المسؤول<select name="custodian_user_id"><option value="">بدون</option>{% for e in employees %}<option value="{{e.id}}">{{e.display_name}}</option>{% endfor %}</select></label>
<label>الموقع<input name="location"></label>
<label>ملاحظات<textarea name="notes" rows="3"></textarea></label>
<button class="primary-btn"><i class="bi bi-check2"></i> حفظ الأصل</button>
</form>
{% endblock %}
