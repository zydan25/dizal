{% extends "base.html" %}
{% block content %}
<div class="page-heading"><h1>إضافة مزارع</h1><p>سيُحفظ الطلب مع المرفقات ثم ينتظر اعتماد المدير.</p></div>
<form method="post" enctype="multipart/form-data" class="mobile-form card-form">
<input type="hidden" name="csrf_token" value="{{csrf_token()}}">
{% if current_user.has_role("manager") %}<label>الموظف المسؤول<select name="employee_id"><option value="">اختر الموظف</option>{% for e in employees %}<option value="{{e.id}}">{{e.display_name}}</option>{% endfor %}</select></label>{% endif %}
<label>اسم المزارع<input name="name" required></label>
<div class="two-col"><label>رقم الهاتف<input name="phone" inputmode="tel" required></label><label>العنوان<input name="address"></label></div>
<div class="two-col"><label>سقف الاستحقاق بالدبة<input name="quota_drums" type="number" step="0.1" min="0" required></label><label>حد المديونية بالدبة<input name="credit_limit_drums" type="number" step="0.1" min="0" required></label></div>
<label>ملاحظات<textarea name="notes" rows="3"></textarea></label>
<div class="section-title"><h2>المرفقات</h2><span>اختيارية الآن ويمكن طلب استكمالها</span></div>
<div class="two-col"><label>البطاقة الأمامية<input type="file" name="id_front" accept=".pdf,.png,.jpg,.jpeg,.webp"></label><label>البطاقة الخلفية<input type="file" name="id_back" accept=".pdf,.png,.jpg,.jpeg,.webp"></label></div>
<div class="two-col"><label>العقد/الالتزام<input type="file" name="contract" accept=".pdf,.png,.jpg,.jpeg,.webp"></label><label>ملف إضافي<input type="file" name="other_document" accept=".pdf,.png,.jpg,.jpeg,.webp"></label></div>
<button class="primary-btn"><i class="bi bi-send"></i> إرسال للمراجعة</button>
</form>
{% endblock %}
