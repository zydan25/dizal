{% extends "base.html" %}
{% block content %}
<div class="page-heading"><h1>إعدادات المشروع</h1><p>إدارة القواعد والثيم وهوية السندات من شاشة واحدة.</p></div>
<form method="post" enctype="multipart/form-data" class="mobile-form card-form">
<input type="hidden" name="csrf_token" value="{{csrf_token()}}">
<div class="section-title"><h2>هوية المشروع</h2><span>الاسم والمعلومات</span></div>
<label>اسم المشروع<input name="project_name" value="{{settings.project_name}}" required></label>
<div class="two-col"><label>اسم المدير<input name="manager_name" value="{{settings.manager_name or ''}}"></label><label>هاتف المدير<input name="manager_phone" value="{{settings.manager_phone or ''}}" inputmode="tel"></label></div>
<label>العملة<input name="currency" value="{{settings.currency}}"></label>
<div class="section-title"><h2>قواعد التشغيل</h2><span>القيم قابلة للتعديل لاحقًا</span></div>
<div class="two-col"><label>لترات الدبة<input name="drum_liters" type="number" step="0.001" min="1" value="{{settings.drum_liters}}"></label><label>أقصى مزارعين للموظف<input name="max_farmers_per_employee" type="number" min="1" value="{{settings.max_farmers_per_employee}}"></label></div>
<div class="two-col"><label>أقصى دين بالدبة<input name="max_credit_drums_per_farmer" type="number" step="0.1" min="0" value="{{settings.max_credit_drums_per_farmer}}"></label><label>أقصى صرف يومي باللتر<input name="max_dispense_liters_per_day" type="number" step="0.001" min="0" value="{{settings.max_dispense_liters_per_day}}"></label></div>
<label>سعر البيع الافتراضي للتر<input name="default_sale_price_per_liter" type="number" step="0.001" min="0" value="{{settings.default_sale_price_per_liter}}"></label>
<div class="section-title"><h2>الثيم</h2><span>ألوان وخط</span></div>
<div class="color-grid">
<label>Primary<input name="primary_color" value="{{settings.primary_color}}"></label><label>Secondary<input name="secondary_color" value="{{settings.secondary_color}}"></label><label>Accent<input name="accent_color" value="{{settings.accent_color}}"></label><label>Surface<input name="surface_color" value="{{settings.surface_color}}"></label><label>Danger<input name="danger_color" value="{{settings.danger_color}}"></label><label>Radius<input name="radius" value="{{settings.radius}}"></label>
</div>
<label>الخط<input name="font_family" value="{{settings.font_family}}"></label>
<div class="section-title"><h2>السندات</h2><span>ترويسة وتذييل</span></div>
<label>ترويسة السند<textarea name="document_header" rows="2">{{settings.document_header or ''}}</textarea></label>
<label>تذييل السند<textarea name="document_footer" rows="2">{{settings.document_footer or ''}}</textarea></label>
<div class="two-col"><label>شعار المشروع<input type="file" name="logo" accept=".png,.jpg,.jpeg,.webp"></label><label>توقيع المدير<input type="file" name="manager_signature" accept=".png,.jpg,.jpeg,.webp"></label></div>
<button class="primary-btn" type="submit"><i class="bi bi-check2"></i> حفظ الإعدادات</button>
</form>
{% endblock %}
