{% extends "base.html" %}
{% block content %}
<div class="page-heading-row"><div class="page-heading"><h1>إضافة دفع</h1><p>سجل السداد، وسيقسم النظام المبلغ تلقائيًا على الديون الأقدم.</p></div><a class="secondary-btn" href="{{url_for('farmers.index')}}"><i class="bi bi-people"></i><span>المزارعون</span></a></div>
<form method="post" class="mobile-form card-form">
<input type="hidden" name="csrf_token" value="{{csrf_token()}}">
{% if current_user.has_role("manager") %}
<label>الموظف المسؤول<select name="employee_id" required><option value="">اختر الموظف</option>{% for employee in employees %}<option value="{{employee.id}}" {% if selected_employee_id|string==employee.id|string %}selected{% endif %}>{{employee.display_name}}</option>{% endfor %}</select></label>
{% endif %}
<label>المزارع<select name="farmer_id" id="payment_farmer" required><option value="">اختر المزارع</option>{% for farmer in farmers %}<option value="{{farmer.id}}" {% if selected_farmer_id|string==farmer.id|string %}selected{% endif %}>{{farmer.name}} · عليه {{accounts[farmer.id].outstanding_amount|clean_number}}</option>{% endfor %}</select></label>
<div class="balance-card compact-balance" id="farmer-balance"><div><span>الدين الحالي</span><strong>0</strong><small>{{project_settings.currency}}</small></div><i class="bi bi-wallet2"></i></div>
<label class="payment-amount-field">المبلغ
  <div class="payment-amount-wrap">
    <input id="payment-amount" name="amount" type="number" step="0.001" min="0.001" required inputmode="decimal" enterkeyhint="done" data-number-words-ignore>
    <span class="payment-currency">{{project_settings.currency}}</span>
  </div>
  <div class="amount-words-box" id="payment-amount-words" aria-live="polite"><i class="bi bi-type"></i><span>يظهر المبلغ كتابةً هنا عند إدخاله</span></div>
</label>
<label>طريقة الدفع<select name="payment_method"><option value="cash">نقد</option><option value="transfer">تحويل</option><option value="bank">بنك</option></select></label>
<label>رقم المرجع<input name="reference"></label>
<label>ملاحظات<textarea name="notes" rows="2"></textarea></label>
<button class="primary-btn form-submit-loading" type="submit">
  <span class="form-submit-icon"><i class="bi bi-cash-coin"></i></span>
  <span class="form-submit-label">تسجيل السداد وإصدار السند</span>
</button>
</form>
<script>
const accounts={{ accounts_json|tojson }};
const select=document.getElementById("payment_farmer"),card=document.querySelector("#farmer-balance strong");
function refreshPayment(){const a=accounts[select.value];const n=a?Number(a.outstanding_amount):0;card.textContent=n.toFixed(3).replace(/\.?0+$/,"");}
select.addEventListener("change",refreshPayment);refreshPayment();

document.addEventListener("DOMContentLoaded",function(){
  const amount=document.getElementById("payment-amount");
  const words=document.getElementById("payment-amount-words");
  if(!amount||!words)return;
  const textNode=words.querySelector("span");
  const currency="{{project_settings.currency}}";
  function refreshAmountWords(){
    const raw=amount.value.trim();
    if(!raw){
      textNode.textContent="يظهر المبلغ كتابةً هنا عند إدخاله";
      words.classList.remove("has-value");
      return;
    }
    const converter=window.DizalNumberWords?.arNumberWords;
    const written=converter?converter(raw):raw;
    textNode.textContent=written+" "+currency;
    words.classList.add("has-value");
  }
  amount.addEventListener("input",refreshAmountWords);
  amount.addEventListener("change",refreshAmountWords);
  refreshAmountWords();
});
</script>
<style>
.form-submit-loading{position:relative;overflow:hidden;transition:opacity .18s ease,transform .18s ease}
.form-submit-icon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;flex:0 0 18px}
.form-submit-label{display:inline-flex;align-items:center;justify-content:center}
.form-submit-loading.is-loading{cursor:wait;pointer-events:none;opacity:.92}
.form-submit-loading.is-loading .form-submit-icon{width:18px;height:18px;border:2px solid rgba(255,255,255,.34);border-top-color:#fff;border-radius:50%;animation:form-submit-spin .72s linear infinite}
.form-submit-loading.is-loading .form-submit-icon i{display:none}
@keyframes form-submit-spin{to{transform:rotate(360deg)}}
</style>
<script>
document.querySelectorAll("form.mobile-form").forEach(function(form){
  form.addEventListener("submit",function(){
    var button=form.querySelector(".form-submit-loading");
    if(!button || button.classList.contains("is-loading")) return;
    var iconWrap=button.querySelector(".form-submit-icon");
    var label=button.querySelector(".form-submit-label");
    button.classList.add("is-loading");
    button.setAttribute("aria-busy","true");
    button.disabled=true;
    if(iconWrap) iconWrap.innerHTML="";
    if(label) label.textContent="جارٍ تسجيل السداد…";
  });
});
</script>
{% endblock %}
