{% extends "base.html" %}
{% block content %}
<div class="page-heading"><h1>تعديل الموظف</h1><p>عدد المزارعين والراتب وحالة الحساب وصلاحيات التشغيل.</p></div>
<form method="post" class="mobile-form card-form">
<input type="hidden" name="csrf_token" value="{{csrf_token()}}">
<label>الاسم<input name="display_name" value="{{employee.display_name}}" required></label>
<div class="two-col"><label>الهاتف<input name="phone" value="{{employee.phone or ''}}"></label><label>البريد<input name="email" value="{{employee.email or ''}}" type="email"></label></div>
<label>دور الحساب
<select name="role" required>
{% for role in roles %}<option value="{{role.name}}" {% if (employee.has_role("manager") and role.name=="manager") or (not employee.has_role("manager") and role.name=="employee") %}selected{% endif %}>{{role.label or role.name}}{% if role.name=="manager" %} · صلاحية مدير كاملة{% endif %}</option>{% endfor %}
</select>
<small class="field-help">يمكن للمدير نقل الحساب بين دور الموظف ودور المدير. لا يمكنك إزالة دور المدير من حسابك الحالي.</small></label>
<label class="check-row"><input type="checkbox" name="active" value="1" {% if employee.active %}checked{% endif %}> الحساب فعال</label>
{% if profile %}
<div class="section-title"><h2>التشغيل</h2><span>Overrides</span></div>
<label>أقصى مزارعين لهذا الموظف<input name="farmer_limit_override" type="number" min="1" value="{{profile.farmer_limit_override or ''}}"></label>
<label class="check-row"><input type="checkbox" name="can_change_farmer_quota" value="1" {% if profile.can_change_farmer_quota %}checked{% endif %}> السماح بتعديل الكمية المتفق عليها للمزارع</label>
<div class="two-col"><label>نوع الراتب<select name="salary_type"><option value="fixed" {% if profile.salary_type=="fixed" %}selected{% endif %}>ثابت</option><option value="per_liter" {% if profile.salary_type=="per_liter" %}selected{% endif %}>ربح لكل لتر</option>
<option value="per_drum" {% if profile.salary_type=="per_drum" %}selected{% endif %}>ربح لكل دبة</option>
<option value="percent_profit" {% if profile.salary_type in ["percent_profit","commission"] %}selected{% endif %}>نسبة من الربح %</option></select></label><label>القيمة (ريال / لتر / دبة / %)<input name="salary_value" type="number" step="0.001" value="{{profile.salary_value}}"></label></div>
{% endif %}
<button class="primary-btn"><i class="bi bi-check2"></i> حفظ</button>
</form>
<div class="section-title"><h2>صلاحيات الموظف</h2></div>
<a class="quick-card" href="{{url_for('employees.permissions',user_id=employee.id)}}"><i class="bi bi-shield-lock"></i><strong>إدارة الصلاحيات</strong><small>إضافات واستثناءات لهذا الموظف</small></a>
{% endblock %}
